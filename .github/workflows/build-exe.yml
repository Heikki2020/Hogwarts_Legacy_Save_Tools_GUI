name: Auto Build, Tag, and Release EXE

on:
  push:
    branches:
      - main               # Triggers on every push to main
  workflow_dispatch:       # Optional: manual run

permissions:
  contents: write          # Needed for tagging and releasing

jobs:
  build-tag-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0       # Needed for tagging properly

      - name: Set up Python 3.14
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Auto bump tag (semver style)
        id: tag
        uses: nickkostov/github-tag-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch   # Or 'minor' / 'major' – change as needed

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "HLST_GUI" HLST_GUI.pyw

      - name: Create/Publish Release with EXE
        uses: softprops/action-gh-release@v3.00
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          files: dist/HLST_GUI.exe
          generate_release_notes: true
